<section class="min-h-screen flex items-center justify-center p-4 bg-gray-50 dark:bg-gray-900" role="alert">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-10 max-w-lg text-center">
    <!-- Icono circulado con animación sutil -->
    <div class="flex justify-center mb-6 animate-pulse">
      <div class="bg-blue-100 dark:bg-blue-900 p-4 rounded-full">
        <svg class="w-16 h-16 text-blue-500 dark:text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
    </div>

    <h2 class="text-4xl font-extrabold text-gray-900 dark:text-gray-100 mb-3">¡Ups! Página no encontrada</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-8 text-lg">Lo sentimos, la página que buscas no existe o ha sido movida.</p>

    <a  (click)="goBack()" routerLink="/countries" aria-label="Volver al inicio" class="inline-flex items-center justify-center px-6 py-3 text-base font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Volver al inicio
    </a>
  </div>
</section>
